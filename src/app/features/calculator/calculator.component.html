<section class="calculator-page" aria-labelledby="calculator-heading">
  <header class="calculator-header">
    <div class="header-copy">
      <p class="header-eyebrow">Tools</p>
      <h2 id="calculator-heading">Calculator</h2>
      <p>Perform basic and scientific calculations.</p>
    </div>
  </header>

  <div class="calculator-panel" role="application" aria-label="Scientific calculator">
    <div class="calculator-display-toolbar">
      <button
        type="button"
        class="calc-angle-toggle"
        (click)="toggleAngleMode()"
        [attr.aria-label]="'Angle mode: ' + angleMode().toUpperCase()"
        [attr.aria-pressed]="angleMode() === 'deg'"
      >
        {{ angleMode().toUpperCase() }}
      </button>
    </div>
    <div class="calculator-display" aria-live="polite" aria-atomic="true">
      @if (expression() && result() === null && !error()) {
        <span class="calculator-expression" aria-hidden="true">{{ expression() }}</span>
      }
      <output
        class="calculator-readout"
        [class.calculator-readout-error]="error()"
        aria-label="Calculator result"
      >
        {{ displayValue() }}
      </output>
      @if (error(); as err) {
        <p class="calculator-error" role="alert">{{ err }}</p>
      }
    </div>

    <div id="calculator-keys" class="calculator-keys" role="group" aria-label="Calculator buttons">
      @for (button of buttons; track button.label + button.value) {
        <button
          type="button"
          class="calc-btn"
          [class.calc-btn-digit]="button.variant === 'digit'"
          [class.calc-btn-operator]="button.variant === 'operator'"
          [class.calc-btn-function]="button.variant === 'function'"
          [class.calc-btn-action]="button.variant === 'action'"
          [class.calc-btn-equals]="button.variant === 'equals'"
          [class.calc-btn-constant]="button.variant === 'constant'"
          [style.grid-column]="button.colspan ? 'span ' + button.colspan : null"
          [attr.aria-label]="button.ariaLabel"
          (click)="onButtonClick(button)"
        >
          {{ button.label }}
        </button>
      }
    </div>
  </div>
</section>
