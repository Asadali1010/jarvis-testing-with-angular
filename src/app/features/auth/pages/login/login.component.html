<div class="login-page">
  <div class="login-panel" aria-labelledby="login-heading">
    <header class="login-header">
      <p class="login-eyebrow">Jarvis Enterprise</p>
      <h1 id="login-heading">Sign in to your account</h1>
      <p class="login-subtitle">Use your workspace credentials to continue.</p>
    </header>

    <form
      class="login-form"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      @if (authError()) {
        <p class="form-alert" role="alert" aria-live="polite">
          {{ authError() }}
        </p>
      }

      <div class="form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          inputmode="email"
          [attr.aria-invalid]="showError('email')"
          [attr.aria-describedby]="showError('email') ? 'email-error' : null"
        />
        @if (showError('email')) {
          <p id="email-error" class="field-error" role="alert">
            {{ getErrorMessage('email') }}
          </p>
        }
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="
            showError('password') ? 'password-error' : null
          "
        />
        @if (showError('password')) {
          <p id="password-error" class="field-error" role="alert">
            {{ getErrorMessage('password') }}
          </p>
        }
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading()"
        [attr.aria-busy]="isLoading()"
      >
        @if (isLoading()) {
          <span class="button-spinner" aria-hidden="true"></span>
          Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
