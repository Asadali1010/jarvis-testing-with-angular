<div class="modal-dialog">
  <div class="modal-content shadow-lg border-0 rounded-3">
    <div class="modal-header bg-light py-3 px-4 border-bottom">
      <h5 class="modal-title fw-bold text-dark">Create New User</h5>
      <button type="button" class="btn-close" (click)="onCancel()" aria-label="Close"></button>
    </div>
    <div class="modal-body p-4">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="needs-validation">
        <div class="row g-3">
          <!-- Name -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input type="text" formControlName="name" class="form-control" 
                   [class.is-invalid]="userForm.get('name')?.touched && userForm.get('name')?.invalid"
                   placeholder="e.g. Jane Doe">
            <div class="invalid-feedback">Name is required (min 2 chars).</div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
            <input type="email" formControlName="email" class="form-control"
                   [class.is-invalid]="userForm.get('email')?.touched && userForm.get('email')?.invalid"
                   placeholder="jane@example.com">
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <!-- Department -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
            <input type="text" formControlName="department" class="form-control"
                   [class.is-invalid]="userForm.get('department')?.touched && userForm.get('department')?.invalid"
                   placeholder="e.g. Engineering">
            <div class="invalid-feedback">Department is required.</div>
          </div>

          <!-- Role -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
            <select formControlName="role" class="form-select"
                    [class.is-invalid]="userForm.get('role')?.touched && userForm.get('role')?.invalid">
              <option value="" disabled selected>Select Role</option>
              <option *ngFor="let role of roles" [value]="role">{{role}}</option>
            </select>
            <div class="invalid-feedback">Please select a role.</div>
          </div>

          <!-- Status -->
          <div class="col-md-12">
            <label class="form-label fw-semibold">Account Status <span class="text-danger">*</span></label>
            <div class="d-flex gap-3 mt-1">
              <div *ngFor="let status of statuses" class="form-check">
                <input class="form-check-input" type="radio" [value]="status" formControlName="status" [id]="'status-' + status">
                <label class="form-check-label" [for]="'status-' + status">{{status}}</label>
              </div>
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('status')?.touched && userForm.get('status')?.invalid">
              Please select a status.
            </div>
          </div>
        </div>

        <div class="modal-footer px-0 pb-0 mt-4 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancel</button>
          <button type="submit" class="btn btn-primary px-4" [disabled]="isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            {{ isSubmitting ? 'Creating...' : 'Create User' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
