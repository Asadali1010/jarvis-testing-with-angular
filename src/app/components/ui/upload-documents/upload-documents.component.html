<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm transition-opacity">
  <div class="bg-[var(--glass-bg)] backdrop-blur-xl border border-[var(--glass-border)] rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
    
    <!-- Header -->
    <div class="p-6 border-b border-[var(--glass-border)] flex justify-between items-center bg-white/10">
      <h3 class="text-xl font-bold text-[var(--text-color)]">Upload Documents</h3>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto flex-1">
      <!-- Drop Zone -->
      <div 
        (dragover)="isDragging = true" 
        (dragleave)="isDragging = false" 
        (drop)="onFileDropped($event)"
        [class.border-indigo-500]="isDragging"
        [class.bg-indigo-50]="isDragging"
        class="border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center transition-all cursor-pointer hover:border-indigo-400 group"
        (click)="fileInput.nativeElement.click()"
      >
        <input 
          #fileInput 
          type="file" 
          multiple 
          (change)="onFileSelected($event)" 
          class="hidden"
        >
        <div class="flex flex-col items-center gap-3">
          <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">
            <i class="bi bi-cloud-arrow-up"></i>
          </div>
          <div>
            <p class="text-lg font-semibold text-[var(--text-color)]">Drag & drop files here</p>
            <p class="text-sm text-slate-500">or <span class="text-indigo-600 font-medium">browse files</span></p>
          </div>
          <p class="text-xs text-slate-400 mt-2">
            Supported: PDF, PNG, JPG, DOCX (Max 10MB per file)
          </p>
        </div>
      </div>

      <!-- File List -->
      <div *ngIf="files.length > 0" class="mt-8 space-y-3">
        <h4 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4">Selected Files</h4>
        <div *ngFor="let fileItem of files; let i = index" class="p-4 rounded-xl border border-slate-200 bg-slate-50/50 flex flex-col gap-2 transition-all">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
              <i class="bi" [ngClass]="fileItem.file.type.includes('image') ? 'bi-image' : 'bi-file-earmark-text'" class="text-indigo-500 text-lg"></i>
              <span class="text-sm font-medium text-slate-700 truncate">{{ fileItem.file.name }}</span>
              <span class="text-xs text-slate-400">{{ formatSize(fileItem.file.size) }}</span>
            </div>
            <button (click)="removeFile(i)" class="text-slate-400 hover:text-rose-500 transition-colors">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          
          <!-- Progress Bar -->
          <div *ngIf="fileItem.status === 'uploading' || fileItem.status === 'completed' || fileItem.status === 'error'" class="mt-2">
            <div class="flex justify-between text-xs mb-1">
              <span *ngIf="fileItem.status === 'uploading'" class="text-indigo-600 font-medium">Uploading... {{ fileItem.progress | number:'1.0-0' }}%</span>
              <span *ngIf="fileItem.status === 'completed'" class="text-emerald-600 font-medium">Completed</span>
              <span *ngIf="fileItem.status === 'error'" class="text-rose-600 font-medium">Error: {{ fileItem.errorMessage }}</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
              <div 
                class="h-full transition-all duration-300" 
                [ngClass]="fileItem.status === 'completed' ? 'bg-emerald-500' : (fileItem.status === 'error' ? 'bg-rose-500' : 'bg-indigo-500')"
                [style.width.%]="fileItem.progress"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-6 border-t border-[var(--glass-border)] flex justify-end gap-3 bg-white/10">
      <button (click)="close.emit()" class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">
        Cancel
      </button>
      <button 
        (click)="uploadFiles()" 
        [disabled]="files.length === 0 || files.every(f => f.status === 'completed')"
        class="px-6 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold hover:bg-indigo-700 disabled:opacity-50 disabled:bg-slate-400 transition-all shadow-sm"
      >
        Upload
      </button>
    </div>
  </div>
</div>
