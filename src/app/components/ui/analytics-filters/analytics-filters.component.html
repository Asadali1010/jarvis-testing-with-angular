<div
  class="bg-[var(--glass-bg)] backdrop-blur-[var(--glass-blur)] border border-[var(--glass-border)] rounded-2xl p-4 shadow-[var(--glass-shadow)] flex flex-col md:flex-row gap-4 items-start md:items-end"
  role="search"
  aria-label="Analytics filters"
>
  <div class="flex flex-col gap-2 w-full md:w-auto md:min-w-[200px]">
    <label
      for="analytics-date-range"
      class="text-sm font-semibold text-slate-700 dark:text-slate-300"
    >
      Date range
    </label>
    <select
      id="analytics-date-range"
      [ngModel]="filters.dateRange.preset"
      (ngModelChange)="onDateRangeChange($event)"
      [disabled]="disabled"
      class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-900/50 text-sm text-[var(--text-color)] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @for (option of dateRangeOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="flex flex-col gap-2 w-full md:w-auto md:min-w-[200px]">
    <label
      for="analytics-data-type"
      class="text-sm font-semibold text-slate-700 dark:text-slate-300"
    >
      Data type
    </label>
    <select
      id="analytics-data-type"
      [ngModel]="filters.dataType"
      (ngModelChange)="onDataTypeChange($event)"
      [disabled]="disabled"
      class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-900/50 text-sm text-[var(--text-color)] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @for (option of dataTypeOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>
</div>
