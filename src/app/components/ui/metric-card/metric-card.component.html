<div
  class="bg-[var(--glass-bg)] backdrop-blur-[var(--glass-blur)] p-6 rounded-2xl shadow-[var(--glass-shadow)] border border-[var(--glass-border)] hover:shadow-md transition-shadow group cursor-default"
  (click)="onCardClick()"
  role="group"
  [attr.aria-label]="label + ': ' + value"
>
  @if (loading) {
    <div class="animate-pulse space-y-4">
      <div class="flex justify-between items-start">
        <div class="w-12 h-12 rounded-xl bg-slate-200 dark:bg-slate-700"></div>
        <div class="w-14 h-6 rounded-full bg-slate-200 dark:bg-slate-700"></div>
      </div>
      <div class="h-4 w-24 rounded bg-slate-200 dark:bg-slate-700"></div>
      <div class="h-8 w-32 rounded bg-slate-200 dark:bg-slate-700"></div>
    </div>
  } @else {
    <div class="flex justify-between items-start mb-4">
      <div
        [class]="'w-12 h-12 rounded-xl flex items-center justify-center text-xl dark:bg-opacity-30 ' + color"
      >
        <i [class]="'bi ' + icon" aria-hidden="true"></i>
      </div>
      <span
        [class]="
          'text-xs font-bold px-2 py-1 rounded-full ' +
          (isPositive
            ? 'text-emerald-600 bg-emerald-50 dark:text-emerald-400 dark:bg-emerald-900/30'
            : 'text-rose-600 bg-rose-50 dark:text-rose-400 dark:bg-rose-900/30')
        "
      >
        {{ change }}
      </span>
    </div>
    <div class="text-slate-500 dark:text-slate-400 text-sm font-medium">{{ label }}</div>
    <div class="text-2xl font-bold text-[var(--text-color)] mt-1">{{ value }}</div>
  }
</div>
