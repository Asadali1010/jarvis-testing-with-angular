<header class="navbar navbar-expand-lg bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800 px-4 py-2 sticky-top z-30 transition-colors duration-300">
  <div class="container-fluid flex items-center justify-between">
    
    <!-- Left Side: Logo and Title -->
    <div class="flex items-center gap-3">
      <div class="flex items-center justify-center w-10 h-10 bg-blue-600 rounded-lg text-white">
        <i class="bi bi-cpu-fill text-xl"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-800 dark:text-white tracking-tight">
        {{ appTitle }}
      </h1>
    </div>

    <!-- Right Side: Actions and Profile -->
    <div class="flex items-center gap-4">
      
      <!-- Theme Toggle -->
      <button 
        (click)="toggleTheme()" 
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 transition-colors"
        title="Toggle Theme"
      >
        <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill text-yellow-400' : 'bi-moon-stars-fill'"></i>
      </button>

      <!-- Notifications -->
      <div class="relative">
        <button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 transition-colors relative">
          <i class="bi bi-bell text-xl"></i>
          <span *ngIf="notificationsCount > 0" 
                class="absolute top-1 right-1 flex items-center justify-center w-4 h-4 text-[10px] font-bold text-white bg-red-500 rounded-full">
            {{ notificationsCount }}
          </span>
        </button>
      </div>

      <!-- User Profile -->
      <div class="flex items-center gap-3 pl-3 border-l border-gray-200 dark:border-slate-800">
        <div class="text-right hidden sm:block">
          <p class="text-sm font-medium text-slate-800 dark:text-white leading-none">{{ userName }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">Administrator</p>
        </div>
        <div class="w-9 h-9 rounded-full overflow-hidden border-2 border-blue-500 cursor-pointer">
          <img [src]="userAvatar" [alt]="userName" class="w-full h-full object-cover">
        </div>
      </div>

    </div>
  </div>
</header>
