<aside
  class="h-screen flex flex-col transition-[width] duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] border-r border-black/5 dark:border-white/10 bg-[var(--glass-bg)] backdrop-blur-[var(--glass-blur)] shadow-[var(--glass-shadow)] text-[var(--text-color)]"
  [ngClass]="isCollapsed ? 'w-20' : 'w-64'"
>
  <!-- Brand: stacks when collapsed so the toggle never crowds the mark -->
  <div
    class="border-b border-black/5 dark:border-white/10"
    [ngClass]="isCollapsed ? 'flex flex-col items-center gap-3 py-4' : 'h-16 flex items-center justify-between px-4'"
  >
    <div class="flex items-center gap-3 min-w-0">
      <div
        class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white font-semibold text-sm shrink-0 ring-1 ring-white/20 shadow-lg shadow-indigo-500/25"
      >
        J
      </div>
      <span *ngIf="!isCollapsed" class="font-semibold tracking-tight truncate">Jarvis</span>
    </div>
    <button
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-expanded]="!isCollapsed"
      class="grid place-items-center w-8 h-8 shrink-0 rounded-lg text-gray-400 dark:text-gray-500 ring-1 ring-transparent hover:text-gray-700 dark:hover:text-gray-200 hover:bg-black/5 dark:hover:bg-white/10 hover:ring-black/5 dark:hover:ring-white/10 transition-all duration-200 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60"
    >
      <i class="bi text-sm" [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
    </button>
  </div>

  <nav class="nav-scroll flex-1 py-4 px-3 overflow-y-auto overflow-x-hidden" aria-label="Main">
    <ul class="space-y-1">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          ariaCurrentWhenActive="page"
          [attr.title]="isCollapsed ? item.label : null"
          class="relative flex items-center rounded-xl transition-all duration-200 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60"
          [ngClass]="[
            isCollapsed ? 'w-11 h-11 mx-auto justify-center' : 'h-11 px-3 gap-3',
            link.isActive
              ? 'bg-indigo-500/12 text-indigo-700 dark:bg-indigo-400/15 dark:text-indigo-200'
              : 'text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-black/[0.03] dark:hover:bg-white/[0.05]'
          ]"
        >
          <!-- Edge bar only at full width; in the rail it would collide with the centred icon. -->
          <span
            *ngIf="link.isActive && !isCollapsed"
            class="absolute left-0 top-1/2 -translate-y-1/2 h-6 w-[3px] rounded-r-full bg-gradient-to-b from-indigo-500 to-violet-600 shadow-[0_0_10px_rgba(99,102,241,0.55)]"
          ></span>
          <i class="text-lg w-5 text-center shrink-0" [ngClass]="'bi ' + item.icon"></i>
          <span *ngIf="!isCollapsed" class="text-sm font-medium tracking-tight truncate">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Account: the card is the way to the profile, so Profile is not repeated in the nav -->
  <div class="p-3 border-t border-black/5 dark:border-white/10">
    <a
      routerLink="/profile"
      routerLinkActive
      #profileLink="routerLinkActive"
      ariaCurrentWhenActive="page"
      [attr.title]="isCollapsed ? user.name : null"
      class="group flex items-center p-2 rounded-xl transition-all duration-200 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60"
      [ngClass]="[
        isCollapsed ? 'justify-center' : 'gap-3',
        profileLink.isActive
          ? 'bg-indigo-500/12 dark:bg-indigo-400/15'
          : 'hover:bg-black/[0.03] dark:hover:bg-white/[0.05]'
      ]"
    >
      <img
        [src]="user.avatar"
        [alt]="user.name"
        class="w-9 h-9 rounded-full object-cover shrink-0 ring-2 ring-black/5 dark:ring-white/10 shadow-sm"
      />
      <div *ngIf="!isCollapsed" class="min-w-0 flex-1">
        <p class="text-sm font-medium tracking-tight truncate">{{ user.name }}</p>
        <p class="text-xs text-gray-500 dark:text-gray-400 truncate">{{ user.email }}</p>
      </div>
      <i
        *ngIf="!isCollapsed"
        class="bi bi-chevron-right text-xs shrink-0 text-gray-300 dark:text-gray-600 group-hover:text-gray-500 dark:group-hover:text-gray-400 transition-colors"
      ></i>
    </a>
  </div>
</aside>
