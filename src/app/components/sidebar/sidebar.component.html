<div 
  [class.w-64]="!isCollapsed" 
  [class.w-20]="isCollapsed" 
  class="h-screen flex flex-col transition-all duration-300 ease-in-out border-r border-gray-200 dark:border-gray-800 bg-[var(--bg-color)] text-[var(--text-color)]"
>
  <!-- Sidebar Header -->
  <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200 dark:border-gray-800">
    <div class="flex items-center gap-3 overflow-hidden">
      <div class="min-w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
        J
      </div>
      <span *ngIf="!isCollapsed" class="font-bold text-lg truncate transition-opacity duration-300 opacity-100">
        Jarvis App
      </span>
    </div>
    <button 
      (click)="toggleSidebar()" 
      class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 transition-colors duration-200"
    >
      <i class="bi bi-list text-xl"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 py-6 px-3 overflow-y-auto overflow-x-hidden space-y-8">
    <div>
      <p *ngIf="!isCollapsed" class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">
        Main Menu
      </p>
      <ul class="space-y-1">
        <li *ngFor="let item of navItems">
          <a 
            [routerLink]="item.path" 
            routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400"
            class="flex items-center p-2 rounded-lg transition-all duration-200 group cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-400"
          >
            <i [class]="'bi ' + item.icon + ' text-lg min-w-[24px] text-center'"
               [class.mr-3]="!isCollapsed"
               [class.mx-auto]="isCollapsed">
            </i>
            <span 
              *ngIf="!isCollapsed" 
              class="font-medium truncate transition-opacity duration-300"
            >
              {{ item.label }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Footer/User Section -->
  <div class="p-4 border-t border-gray-200 dark:border-gray-800">
    <div class="flex items-center p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer group">
       <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-blue-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0" [class.mr-3]="!isCollapsed">
         AD
       </div>
       <div *ngIf="!isCollapsed" class="flex flex-col truncate overflow-hidden">
         <span class="text-sm font-semibold truncate">Admin User</span>
         <span class="text-xs text-gray-500 truncate">admin@jarvis.ai</span>
       </div>
    </div>
  </div>
</div>
